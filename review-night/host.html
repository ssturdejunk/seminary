<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Night: board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.board { overflow: hidden; font-size: clamp(16px, 1.55vw, 30px); }
  .shell { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  header.bar {
    display: flex; justify-content: space-between; align-items: center; gap: 1em;
    padding: 0.8em 1.4em 0.5em;
  }
  .where h1 { font-size: 1.6em; color: var(--saffron); }
  .where .sub { color: var(--mist); font-size: 0.85em; }
  .joinbox { display: flex; align-items: center; gap: 0.8em; text-align: right; }
  .joinbox .url { font-size: 0.8em; color: var(--mist); }
  .joinbox .code { font-family: var(--display); font-size: 2em; letter-spacing: 0.08em; line-height: 1; }
  .joinbox .qr svg { width: 4.2em; height: 4.2em; background: var(--paper); border-radius: 8px; display: block; }
  main#stage { padding: 0.5em 2.5em 5.2em; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
  .fresh .rise { animation: rise 0.5s cubic-bezier(.2,.8,.2,1) both; }
  .fresh .rise:nth-child(2) { animation-delay: 0.08s; } .fresh .rise:nth-child(3) { animation-delay: 0.16s; }
  .fresh .rise:nth-child(4) { animation-delay: 0.24s; } .fresh .rise:nth-child(5) { animation-delay: 0.32s; }
  .fresh .rise:nth-child(6) { animation-delay: 0.4s; } .fresh .rise:nth-child(7) { animation-delay: 0.48s; }
  @keyframes rise { from { opacity: 0; transform: translateY(0.8em); } to { opacity: 1; transform: none; } }

  /* Timer band: the river draining across the bottom of the screen. */
  .river { height: 0.7em; background: var(--deep); position: relative; }
  .river i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--saffron); transition: width 0.2s linear, background 0.3s; }
  .river.low i { background: var(--coral); }
  .river .secs { position: absolute; left: 1.4em; bottom: 1.1em; font-family: var(--display); font-size: 2.2em; color: var(--saffron); }
  .river.low .secs { color: var(--coral); }

  nav.controls { position: fixed; right: 1.2em; bottom: 1.6em; display: flex; gap: 0.5em; z-index: 5; font-size: 0.8em; flex-wrap: wrap; justify-content: flex-end; max-width: 86vw; }
  nav.controls button { padding: 0.55em 1em; }
  nav.controls .primary { font-size: 1.15em; }
  body.quiet .status:not(.bad) { display: none; }

  .big { font-family: var(--display); font-size: 3.6em; line-height: 1.05; }
  .prompt { font-size: 2.05em; font-weight: 700; max-width: 34em; line-height: 1.25; margin-bottom: 0.9em; }
  .count { color: var(--mist); margin-top: 0.8em; font-size: 0.95em; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7em; }
  .tile {
    background: var(--tide); border-radius: 18px; padding: 0.75em 1em; font-size: 1.35em;
    display: flex; align-items: center; gap: 0.7em; position: relative; min-height: 2.6em;
  }
  .tiles.many { gap: 0.5em; }
  .tiles.many .tile { font-size: 1.12em; min-height: 2.2em; padding: 0.55em 0.9em; }
  .intro { max-width: 70em; }
  .intro-top { display: flex; justify-content: space-between; align-items: center; gap: 1em; }
  .rchips { display: flex; gap: 0.4em; }
  .rchip { width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; background: var(--tide); color: var(--mist); font-family: var(--display); }
  .rchip.on { background: var(--saffron); color: var(--deep); }
  .rchip.done { background: var(--mint); color: var(--deep); }
  .intro-title { display: flex; align-items: baseline; gap: 0.6em; flex-wrap: wrap; margin-top: 0.1em; }
  .intro-title .big { color: var(--saffron); font-size: 3.6em; }
  .intro-title .mult { font-family: var(--display); background: var(--coral); color: var(--deep); border-radius: 999px; padding: 0.1em 0.7em; font-size: 1.5em; }
  .intro .lead { font-size: 1.3em; margin: 0.2em 0 0.7em; }
  .intro-cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1em; }
  .intro .card { background: var(--tide); border-radius: 18px; padding: 0.8em 1.1em; }
  .intro .card h3 { color: var(--saffron); font-size: 1.1em; margin-bottom: 0.3em; }
  .intro .card ol, .intro .card ul { margin: 0; padding-left: 1.2em; font-size: 1.02em; }
  .intro .card li { margin: 0.25em 0; }
  .intro-foot { margin-top: 0.8em; font-size: 0.9em; }
  .tile .k { font-family: var(--display); background: var(--deep); color: var(--saffron); min-width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; font-size: 0.9em; }
  .tile .n { margin-left: auto; font-family: var(--display); color: var(--mist); }
  .tile.right { background: var(--mint); color: var(--deep); }
  .tile.right .k { color: var(--mint); }
  .tile.right .n { color: var(--deep); }
  .tile.dim { opacity: 0.45; }
  .tile .by { display: block; font-size: 0.62em; color: var(--mist); margin-top: 0.15em; }
  .tile.right .by { color: var(--deep); }
  .tile .txt { flex: 1; }
  .note { margin-top: 0.9em; font-size: 1.05em; color: var(--paper); }
  .note b { color: var(--saffron); }

  .split { display: grid; grid-template-columns: 1fr 15em; gap: 2em; align-items: start; }
  .board-list { background: var(--deep); border-radius: 18px; padding: 0.8em 1em; }
  .board-list h3 { color: var(--saffron); font-size: 1.1em; margin-bottom: 0.4em; }
  .row { display: flex; gap: 0.6em; align-items: center; padding: 0.25em 0; }
  .row .dot { width: 0.8em; height: 0.8em; border-radius: 50%; flex: none; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .pts { font-family: var(--display); }
  .row .gain { color: var(--mint); font-size: 0.8em; min-width: 3em; text-align: right; }

  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 3em; align-items: center; }
  .lobby .qrbig svg { width: 15em; height: 15em; background: var(--paper); border-radius: 18px; display: block; }
  .lobby .code { font-family: var(--display); font-size: 6em; letter-spacing: 0.08em; line-height: 1; color: var(--saffron); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.45em; margin-top: 1em; max-height: 9em; overflow: hidden; }
  .chip { padding: 0.25em 0.75em; border-radius: 999px; color: var(--deep); font-weight: 700; }
  .fresh-chip { animation: pop 0.35s ease-out; }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } }

  .sets { display: grid; grid-template-columns: repeat(auto-fit, minmax(11em, 1fr)); gap: 0.8em; margin-top: 1em; }
  .set { background: var(--tide); border-radius: 18px; padding: 0.7em 0.9em; }
  .set h3 { font-size: 1.1em; color: var(--saffron); margin-bottom: 0.3em; }
  .set .m { display: flex; justify-content: space-between; padding: 0.12em 0; }
  .set .m.done { color: var(--mint); }

  .drawings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8em; }
  .drawing { background: var(--paper); border-radius: 16px; padding: 0.4em; color: var(--deep); position: relative; }
  .drawing img { width: auto; max-width: 100%; height: 100%; max-height: 31vh; aspect-ratio: 1; display: block; margin: 0 auto; border-radius: 10px; }
  .drawing .lbl { position: absolute; top: 0.4em; left: 0.4em; font-family: var(--display); background: var(--deep); color: var(--saffron); width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; }
  .drawing .artist { text-align: center; font-weight: 700; padding: 0.2em 0 0; }
  .drawing.fav { box-shadow: 0 0 0 5px var(--saffron); }
  .drawing .star { position: absolute; top: 0.4em; right: 0.5em; font-size: 1.4em; }
  .storylist { display: grid; grid-template-columns: 1fr 1fr; gap: 0.15em 1.2em; margin-top: 0.6em; font-size: 0.9em; line-height: 1.25; }
  .storylist div.right { color: var(--mint); font-weight: 700; }

  .leader { max-width: 34em; }
  .leader .row { font-size: 1.5em; padding: 0.35em 0.6em; border-radius: 14px; }
  .leader .row:first-child { background: var(--tide); }
  .leader .rank { font-family: var(--display); width: 1.6em; color: var(--saffron); }
  .podium { display: flex; align-items: flex-end; gap: 1.2em; margin-top: 1em; }
  .podium .p { text-align: center; width: 10em; }
  .podium .blk { border-radius: 16px 16px 0 0; display: grid; place-items: center; font-family: var(--display); font-size: 3em; color: var(--deep); }
  .podium .nm { font-weight: 700; font-size: 1.3em; margin-bottom: 0.3em; }

  .setup { max-width: 46em; }
  .setup p { max-width: 38em; }
  .setup .card { background: var(--tide); border-radius: 18px; padding: 1em 1.2em; margin-top: 1em; }
  .setup .modqr { display: flex; gap: 1.2em; align-items: center; }
  .setup .modqr svg { width: 8em; height: 8em; background: var(--paper); border-radius: 12px; display: block; }
  .warn { color: var(--coral); font-weight: 700; }
  .voiceset { display: grid; gap: 0.6em; margin-bottom: 1em; }
  .voiceset label { display: grid; gap: 0.25em; }
  .voiceset .chk { display: flex; gap: 0.5em; align-items: center; }
  .voiceset select { font: inherit; padding: 0.5em; border-radius: 10px; border: 0; background: var(--paper); color: var(--deep); width: 100%; }
  .voiceset input[type=range] { accent-color: #F4B942; }
  .status { position: fixed; left: 1.4em; bottom: 1.6em; font-size: 0.7em; color: var(--mist); }
  .status.bad { color: var(--coral); }
  /* ---------- phone layout: switched on by host.js for narrow or short screens ---------- */
  html.compact, html.compact body { height: auto; }
  body.compact { min-height: 100%; overflow: auto; font-size: 16px; }
  .compact .shell { display: block; height: auto; min-height: 100vh; min-height: 100dvh; }
  .compact header.bar { padding: 0.9em 0.9em 0.3em; flex-wrap: wrap; }
  .compact .where h1 { font-size: 1.15em; }
  .compact .joinbox { gap: 0.5em; }
  .compact .joinbox .code { font-size: 1.5em; }
  .compact .joinbox .qr svg { width: 3em; height: 3em; }
  .compact main#stage { padding: 0.4em 0.9em 8.8em; overflow: visible; justify-content: flex-start; }
  .compact .river { position: fixed; top: 0; left: 0; right: 0; z-index: 8; height: 0.45em; }
  .compact .river .secs { top: 0.7em; bottom: auto; left: auto; right: 0.8em; font-size: 1.6em; }
  .compact nav.controls { left: 0; right: 0; bottom: 0; max-width: none; justify-content: stretch; padding: 0.6em 0.7em calc(0.6em + env(safe-area-inset-bottom, 0px)); background: var(--deep); border-top: 1px solid var(--tide-2); font-size: 1em; gap: 0.4em; }
  .compact nav.controls button { flex: 1 1 auto; padding: 0.6em 0.4em; font-size: 0.85em; min-height: 44px; white-space: nowrap; }
  .compact nav.controls .primary { order: -1; flex: 1 1 100%; padding: 0.85em; font-size: 1.15em; }
  .compact .status { position: static; margin-top: 0.25em; font-size: 0.72em; }
  .compact .big { font-size: 2.2em !important; }
  .compact .prompt { font-size: 1.3em; margin-bottom: 0.6em; }
  .compact .tiles { grid-template-columns: 1fr; }
  .compact .tile, .compact .tiles.many .tile { font-size: 1.05em; min-height: 2.4em; padding: 0.6em 0.8em; }
  .compact .split { grid-template-columns: 1fr; gap: 1em; }
  .compact .lobby { grid-template-columns: 1fr; gap: 1em; justify-items: center; text-align: center; }
  .compact .lobby .qrbig svg { width: min(62vw, 15em); height: min(62vw, 15em); }
  .compact .lobby .code { font-size: 3.6em; }
  .compact .chips { justify-content: center; max-height: none; }
  .compact .intro-title .big { font-size: 2.3em !important; }
  .compact .intro-title .mult { font-size: 1em; }
  .compact .intro .lead { font-size: 1.05em; }
  .compact .intro-cols { grid-template-columns: 1fr; }
  .compact .drawings { grid-template-columns: repeat(2, 1fr) !important; }
  .compact .drawing img { max-height: 26vh; }
  .compact .storylist { grid-template-columns: 1fr; }
  .compact .leader .row { font-size: 1.05em; }
  .compact .podium { gap: 0.5em; }
  .compact .podium .p { width: 6.5em; }
  .compact .podium .blk { font-size: 2em; }
  .compact dialog { width: calc(100vw - 1.6em); max-height: 88vh; overflow: auto; }
  @media (min-width: 600px) { .compact nav.controls .primary { order: 0; flex: 0 0 auto; padding: 0.7em 1.2em; font-size: 1em; } }
  dialog { background: var(--tide); color: var(--paper); border: 0; border-radius: 18px; padding: 1.2em 1.4em; max-width: 30em; }
  dialog::backdrop { background: rgba(5, 15, 20, 0.7); }
  dialog .acts { display: flex; gap: 0.6em; justify-content: flex-end; margin-top: 1em; flex-wrap: wrap; }
</style>
</head>
<body class="board">
<div class="shell">
  <header class="bar">
    <div class="where"><h1 id="where"></h1><div class="sub" id="whereSub"></div><div class="status" id="status"></div></div>
    <div class="joinbox" id="joinbox"></div>
  </header>
  <main id="stage"></main>
  <div class="river" id="river"><i></i><span class="secs"></span></div>
  <nav class="controls" id="controls"></nav>
</div>
<dialog id="tools">
  <h3>Host tools</h3>
  <p class="muted">Moderate from your phone so the projector never shows a fake answer or drawing before you see it.</p>
  <div id="toolsBody"></div>
  <div class="acts">
    <button id="toolsReset" class="ghost">End and start over</button>
    <button id="toolsClose" class="primary">Close</button>
  </div>
</dialog>
<dialog id="confirm">
  <p id="confirmText"></p>
  <div class="acts"><button id="confirmNo" class="ghost">Cancel</button><button id="confirmYes" class="primary">Yes</button></div>
</dialog>
<script src="config.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="lib/qrcode.js"></script>
<script src="net.js"></script>
<script src="audio.js"></script>
<script src="voice.js"></script>
<script src="host.js"></script>
</body>
</html>
