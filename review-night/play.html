<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2B3A">
<title>Review Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.phone {
    font-size: 18px; min-height: 100%;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    overscroll-behavior: none;
  }
  .top { display: flex; align-items: center; gap: 0.6em; padding: 0.8em 1em 0.4em; }
  .top .dot { width: 0.9em; height: 0.9em; border-radius: 50%; flex: none; }
  .top .nm { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sc { font-family: var(--display); font-size: 1.3em; color: var(--saffron); }
  .top .rk { color: var(--mist); font-size: 0.85em; }
  .tbar { height: 6px; background: var(--deep); margin: 0 1em; border-radius: 3px; overflow: hidden; }
  .tbar i { display: block; height: 100%; width: 0; background: var(--saffron); }
  .tbar.low i { background: var(--coral); }
  .conn { margin: 0.5em 1em 0; padding: 0.5em 0.8em; border-radius: 10px; background: var(--coral); color: var(--deep); font-weight: 700; font-size: 0.9em; }
  #app { padding: 1em 1em 2em; max-width: 34em; margin: 0 auto; }
  .h { font-family: var(--display); font-size: 2em; line-height: 1.1; margin: 0.2em 0 0.4em; }
  .p { font-size: 1.15em; font-weight: 700; margin: 0.2em 0 0.9em; line-height: 1.3; }
  .sub { color: var(--mist); margin-bottom: 0.8em; }
  .choices { display: grid; gap: 0.6em; }
  .choices button { text-align: left; display: flex; gap: 0.7em; align-items: center; padding: 0.85em 1em; font-size: 1.05em; background: var(--tide); min-height: 3.4em; }
  .choices button .k { font-family: var(--display); background: var(--deep); color: var(--saffron); min-width: 1.8em; height: 1.8em; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .choices button.on { background: var(--saffron); color: var(--deep); }
  .choices button.on .k { color: var(--saffron); }
  .choices.locked button:not(.on) { opacity: 0.4; }
  .stack { display: grid; gap: 0.7em; }
  .result { text-align: center; padding-top: 1.5em; }
  .result .gain { font-family: var(--display); font-size: 4em; color: var(--mint); line-height: 1; }
  .result .gain.neg { color: var(--coral); }
  .result .ok { font-family: var(--display); font-size: 2.2em; }
  .result .ok.y { color: var(--mint); } .result .ok.n { color: var(--coral); }
  .err { color: var(--coral); font-weight: 700; margin-top: 0.4em; }
  .sent { color: var(--mint); font-weight: 700; margin-top: 0.4em; }
  .pad { background: var(--paper); border-radius: 14px; touch-action: none; width: 100%; aspect-ratio: 1; display: block; }
  .tools { display: flex; gap: 0.4em; flex-wrap: wrap; align-items: center; margin: 0.6em 0; }
  .sw { width: 2.3em; height: 2.3em; border-radius: 50%; padding: 0; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25); }
  .sw.on { box-shadow: 0 0 0 3px var(--paper); }
  .tools .t { padding: 0.5em 0.8em; font-size: 0.9em; }
  .wager { font-family: var(--display); font-size: 3em; text-align: center; color: var(--saffron); }
  input[type=range] { width: 100%; accent-color: #F4B942; height: 2em; }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5em; margin: 0.6em 0 1em; }
  .mod .sub-row { display: flex; gap: 0.6em; align-items: center; background: var(--tide); border-radius: 12px; padding: 0.5em 0.7em; margin-bottom: 0.4em; }
  .mod .sub-row.off { opacity: 0.5; }
  .mod .sub-row img { width: 4.5em; height: 4.5em; border-radius: 8px; background: var(--paper); flex: none; }
  .mod .sub-row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .mod .sub-row button { padding: 0.45em 0.8em; font-size: 0.85em; flex: none; }
  .mod h3 { margin: 1.2em 0 0.5em; color: var(--saffron); font-size: 1.2em; }
  .mod .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5em; }
  .mod .acts .primary { grid-column: 1 / -1; padding: 1em; font-size: 1.1em; }
  label.f { display: block; margin: 0.8em 0 0.3em; color: var(--mist); }
</style>
</head>
<body class="phone">
<div id="top" class="top hidden"></div>
<div id="tbar" class="tbar hidden"><i></i></div>
<div id="conn" class="conn hidden"></div>
<main id="app"></main>
<script src="config.js"></script>
<script src="lib/peerjs.min.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="net.js"></script>
<script src="play.js"></script>
</body>
</html>
